<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> LearnGoose </title>
  <style>
    /* Global Resets & Typography */
    :root {
      --bg-main: #f8f9fa;
      --bg-sidebar: #ffffff;
      --text-main: #212529;
      --text-muted: #6c757d;
      --primary: #0969da;
      --primary-hover: #054da7;
      --border-color: #d0d7de;
      --accent-bg: #f6f8fa;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      min-height: 100vh;
      background-color: var(--bg-main);
      color: var(--text-main);
    }
    
    /* Layout & Sidebar Styling */
    #sidebar {
      width: 280px;
      background-color: var(--bg-sidebar);
      padding: 2rem 1.5rem;
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    
    #sidebar h3 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05rem;
      color: var(--text-muted);
      margin-top: 0;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border-color);
    }
    
    #sidebar-links {
      list-style-type: none;
      padding: 0;
      margin: 0;
    }
    
    #sidebar-links li {
      margin-bottom: 0.4rem;
    }
    
    #sidebar-links a {
      display: flex;
      align-items: center;
      text-decoration: none;
      color: var(--text-main);
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    /* Subtle document icon before each link */
    #sidebar-links a::before {
      content: "📄";
      margin-right: 0.5rem;
      font-size: 0.85rem;
      opacity: 0.7;
    }
    
    #sidebar-links a:hover {
      background-color: var(--accent-bg);
      color: var(--primary);
      transform: translateX(4px);
    }

    /* State messages (loading/error) */
    .status-msg {
      font-size: 0.9rem;
      color: var(--text-muted);
      font-style: italic;
      padding: 0.5rem;
    }
    
    /* Main Content Area */
    #main-content {
      flex-grow: 1;
      padding: 3rem;
      max-width: 800px;
    }
    
    #main-content h1 {
      font-size: 2.25rem;
      font-weight: 600;
      margin-top: 0;
      margin-bottom: 1rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.5rem;
    }

    #main-content p {
      font-size: 1.1rem;
      line-height: 1.6;
      color: #3f444e;
    }

    /* Mobile Responsive Tweaks */
    @media (max-width: 768px) {
      body {
        flex-direction: column;
      }
      #sidebar {
        width: 100%;
        height: auto;
        border-right: none;
        border-bottom: 1px solid var(--border-color);
        padding: 1.5rem;
      }
      #main-content {
        padding: 1.5rem;
      }
    }
  </style>
</head>
<body>

  <!-- Sidebar Component -->
  <nav id="sidebar">
    <h3>Project Pages</h3>
    <ul id="sidebar-links">
      <li class="status-msg">Scanning repository...</li>
    </ul>
  </nav>

  <!-- Main Content Area -->
  <main id="main-content">
    <h1>Welcome to ProxyNoxy's Site</h1>
    <p>This page automatically pulls any new HTML files you push into your <strong>proxynoxy.github.io</strong> repository and shows them instantly in the sidebar menu on the left.</p>
  </main>

  <!-- JavaScript Logic -->
  <script>
    async function loadSidebar() {
      const username = 'ProxyNoxy'; 
      const repo = 'proxynoxy.github.io';
      
      // Attempting 'main' branch first
      let url = `https://github.com{username}/${repo}/git/trees/main?recursive=1`;

      try {
        let response = await fetch(url);
        
        // Fallback to 'master' if the repository defaults to the master branch name
        if (response.status === 404) {
          url = `https://github.com{username}/${repo}/git/trees/master?recursive=1`;
          response = await fetch(url);
        }
        
        if (!response.ok) throw new Error('Failed to fetch repo data');
        
        const data = await response.json();
        const sidebarEl = document.getElementById('sidebar-links');
        sidebarEl.innerHTML = ''; // Clear status message

        // Target all HTML files, ignoring the core index page
        const htmlFiles = data.tree.filter(file => 
          file.path.endsWith('.html') && file.path !== 'index.html'
        );

        if (htmlFiles.length === 0) {
          sidebarEl.innerHTML = '<li class="status-msg">No project pages found yet.</li>';
          return;
        }

        // Add each discovered file to the menu layout
        htmlFiles.forEach(file => {
          const listItem = document.createElement('li');
          const link = document.createElement('a');
          
          link.href = file.path;
          
          // Capitalize names and convert symbols into spaces
          const cleanName = file.path.replace('.html', '').replace(/[-_]/g, ' ');
          link.textContent = cleanName.charAt(0).toUpperCase() + cleanName.slice(1);
          
          listItem.appendChild(link);
          sidebarEl.appendChild(listItem);
        });
      } catch (error) {
        console.error('Error fetching repository files:', error);
        document.getElementById('sidebar-links').innerHTML = '<li class="status-msg">Error loading menu.</li>';
      }
    }

    document.addEventListener('DOMContentLoaded', loadSidebar);
  </script>
</body>
</html>
