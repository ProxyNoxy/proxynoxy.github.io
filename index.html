<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="LearnGoose — browser games hub.">
  <meta name="theme-color" content="#ff006e">
  <meta property="og:title" content="LearnGoose">
  <meta property="og:description" content="W LearnGoose.">
  <meta property="og:type" content="website">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>LearnGoose</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #ff8bc7;
      --primary-2: #ffc1e3;
      --primary-3: #8ae7ff;
      --bg-1: #0d1020;
      --bg-2: #171b38;
      --bg-3: #232b56;
      --panel: rgba(18, 22, 38, 0.66);
      --panel-strong: rgba(20, 25, 46, 0.8);
      --line: rgba(255, 255, 255, 0.1);
      --text: #f4f7ff;
      --muted: #c4cde8;
      --soft: #edf4ff;
      --shadow: rgba(135, 94, 255, 0.28);
      --spectrum-duration: 28s;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      position: relative;
      isolation: isolate;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Oxygen", "Ubuntu", sans-serif;
      color: var(--text);
      display: flex;
      flex-direction: row;
      /* keep the base background dark */
      background: var(--bg-1);
    }

    /* Animated spectrum overlay for the whole page -- toned down to keep the background dark */
    body::before {
      content: "";
      position: fixed;
      inset: -20%;
      z-index: -1;
      pointer-events: none;
      background:
        linear-gradient(
          120deg,
          hsl(0 95% 60%),
          hsl(35 95% 62%),
          hsl(70 95% 58%),
          hsl(120 95% 58%),
          hsl(175 95% 55%),
          hsl(220 95% 60%),
          hsl(270 90% 62%),
          hsl(315 95% 60%),
          hsl(360 95% 60%)
        );
      background-size: 250% 250%;
      /* make the overlay subtle so the page remains dark */
      filter: saturate(1.05) brightness(0.28);
      mix-blend-mode: screen;
      animation: spectrumFade var(--spectrum-duration) ease-in-out infinite alternate;
      opacity: 0.12; /* reduced from 0.9 to keep the underlying dark background visible */
    }

    /* Re-usable spectrum animation for other elements (text & backgrounds) */
    .spectrum-bg {
      background-image: linear-gradient(120deg,
        hsl(0 95% 60%),
        hsl(35 95% 62%),
        hsl(70 95% 58%),
        hsl(120 95% 58%),
        hsl(175 95% 55%),
        hsl(220 95% 60%),
        hsl(270 90% 62%),
        hsl(315 95% 60%),
        hsl(360 95% 60%));
      background-size: 250% 250%;
      animation: spectrumFade var(--spectrum-duration) ease-in-out infinite alternate;
    }

    .spectrum-text {
      background-image: linear-gradient(135deg,
        hsl(0 95% 60%),
        hsl(35 95% 62%),
        hsl(70 95% 58%),
        hsl(120 95% 58%),
        hsl(175 95% 55%),
        hsl(220 95% 60%));
      background-size: 300% 300%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: spectrumFade var(--spectrum-duration) linear infinite;
      /* Add a gentle glow that also shifts with the animation */
      text-shadow: 0 0 14px rgba(255,255,255,0.04);
    }

    @keyframes spectrumFade {
      0% {
        background-position: 0% 50%;
        filter: hue-rotate(0deg) saturate(1.1) brightness(1.08);
      }
      25% {
        background-position: 35% 30%;
        filter: hue-rotate(80deg) saturate(1.25) brightness(1.12);
      }
      50% {
        background-position: 100% 50%;
        filter: hue-rotate(180deg) saturate(1.3) brightness(1.14);
      }
      75% {
        background-position: 60% 80%;
        filter: hue-rotate(260deg) saturate(1.2) brightness(1.12);
      }
      100% {
        background-position: 0% 50%;
        filter: hue-rotate(360deg) saturate(1.1) brightness(1.08);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      body::before {
        animation: none;
      }
      .spectrum-bg,
      .spectrum-text {
        animation: none;
      }
    }

    #app {
      display: flex;
      width: 100%;
      height: 100%;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    #app.unlocked {
      opacity: 1;
      pointer-events: auto;
    }

    #sidebar {
      width: 300px;
      height: 100vh;
      background: rgba(13, 17, 30, 0.74);
      border-right: 1px solid var(--line);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 18px 0 36px rgba(7, 9, 20, 0.3);
      flex-shrink: 0;
    }

    #sidebar-header {
      padding: 1.8rem 1.5rem 1.4rem;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255, 139, 199, 0.12), rgba(138, 231, 255, 0.04));
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
    }

    /* subtle animated overlay inside the header */
    #sidebar-header::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.06; /* reduced so header stays mostly dark */
      mix-blend-mode: screen;
      /* use the reusable spectrum class */
      background-image: linear-gradient(120deg,
        hsl(0 95% 60%),
        hsl(35 95% 62%),
        hsl(70 95% 58%),
        hsl(120 95% 58%),
        hsl(175 95% 55%),
        hsl(220 95% 60%));
      background-size: 200% 200%;
      animation: spectrumFade calc(var(--spectrum-duration) * 1.2) ease-in-out infinite alternate;
    }

    #sidebar-header h1 {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 0.45rem;
      /* animated gradient text */
      background-image: linear-gradient(135deg, hsl(320 95% 70%), hsl(200 95% 65%), hsl(20 95% 65%));
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 0 18px rgba(255, 139, 199, 0.12);
      animation: spectrumFade var(--spectrum-duration) linear infinite;
    }

    #sidebar-header p {
      font-size: 0.82rem;
      color: var(--muted);
      margin: 0;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    #open-grid-btn {
      appearance: none;
      border: 1px solid rgba(255,255,255,0.06);
      background: rgba(255,255,255,0.02);
      color: var(--soft);
      padding: 0.45rem 0.6rem;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
    }

    #sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: 1.2rem 0.9rem;
    }

    #sidebar-content::-webkit-scrollbar {
      width: 6px;
    }

    #sidebar-content::-webkit-scrollbar-track {
      background: transparent;
    }

    #sidebar-content::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, var(--primary) 0%, var(--primary-3) 100%);
      border-radius: 999px;
    }

    #sidebar-links {
      list-style: none;
      padding: 0;
    }

    #sidebar-links li {
      margin-bottom: 0.7rem;
    }

    #sidebar-links a {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.9rem 1rem;
      border-radius: 14px;
      text-decoration: none;
      color: var(--soft);
      font-size: 0.96rem;
      font-weight: 600;
      transition: all 0.22s ease;
      border-left: 3px solid transparent;
      cursor: pointer;
      word-break: break-word;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255,255,255,0.04);
    }

    #sidebar-links a::before {
      content: "✦";
      font-size: 0.9rem;
      color: var(--primary-3);
      flex-shrink: 0;
      text-shadow: 0 0 12px rgba(138, 231, 255, 0.7);
    }

    #sidebar-links a:hover {
      background: rgba(138, 231, 255, 0.08);
      border-color: rgba(138, 231, 255, 0.18);
      box-shadow: 0 8px 24px rgba(138, 231, 255, 0.12);
      color: #fff;
      transform: translateX(4px);
    }

    #sidebar-links a.active {
      background: linear-gradient(135deg, rgba(255, 139, 199, 0.14), rgba(138, 231, 255, 0.08));
      border-color: rgba(255, 139, 199, 0.32);
      box-shadow: 0 0 0 1px rgba(255, 139, 199, 0.18), 0 12px 30px rgba(255, 139, 199, 0.14);
      color: #fff;
      border-left-color: var(--primary);
    }

    .status-msg {
      padding: 1rem 1.5rem;
      color: var(--muted);
      font-size: 0.9rem;
      text-align: center;
      font-style: italic;
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 12px;
      background: rgba(255,255,255,0.01);
    }

    /* overlay grid - conservative and non-invasive */
    #grid-overlay {
      position: fixed;
      inset: 0;
      z-index: 1200;
      background: rgba(6,8,14,0.92);
      display: flex;
      flex-direction: column;
      padding: 1.25rem;
      gap: 0.75rem;
      opacity: 0;
      pointer-events: none;
      transform: translateY(12px) scale(0.998);
      transition: opacity 260ms ease, transform 260ms cubic-bezier(.2,.9,.1,1), pointer-events 0ms linear 260ms;
    }

    #grid-overlay.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0) scale(1);
      transition: opacity 260ms ease, transform 260ms cubic-bezier(.2,.9,.1,1);
    }

    #grid-overlay .overlay-header {
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:.75rem;
    }

    #overlay-games-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 0.9rem;
      margin-top: 0.25rem;
      overflow:auto;
      padding-bottom: 1rem;
    }

    .grid-card {
      background: rgba(17,21,37,0.86);
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 12px;
      padding: 0.6rem;
      display:flex;
      flex-direction:column;
      gap:0.5rem;
      min-height: 88px;
      box-shadow: 0 10px 26px rgba(0,0,0,0.26);
    }

    .grid-thumb {
      height:56px;
      border-radius:8px;
      background:linear-gradient(135deg, rgba(255,139,199,0.12), rgba(138,231,255,0.06));
      display:flex;align-items:center;justify-content:center;font-weight:800;color:rgba(255,255,255,0.9);
    }

    .grid-row {
      display:flex;align-items:center;justify-content:space-between;gap:.5rem;
    }

    .grid-name { font-weight:700;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.95rem }

    .grid-play { appearance:none;border:none;background:linear-gradient(135deg,var(--primary) 0%,var(--primary-2) 100%);color:#fff;padding:.5rem .75rem;border-radius:8px;font-weight:800;cursor:pointer }

    @media (max-width:768px){ #grid-overlay{padding:.6rem} #overlay-games-grid{grid-template-columns:repeat(auto-fit,minmax(140px,1fr));} }

    /* keep the rest of the layout unchanged */

    #main-container { flex: 1; display:flex; flex-direction:column; height:100vh; overflow:hidden; position:relative }

    @media (max-width: 1024px) { #sidebar{width:250px} }
  </style>
</head>
<body>
  <div id="auth-screen">
    <div id="auth-card">
      <h2>Access required</h2>
      <p>Enter the password to view the game pages.</p>

      <form id="auth-form">
        <label for="password-input">Password</label>
        <input id="password-input" type="password" autocomplete="current-password" placeholder="Enter password" />
        <div id="auth-error" aria-live="polite"></div>
        <button type="submit">Unlock</button>
      </form>
    </div>
  </div>

  <div id="app">
    <nav id="sidebar">
      <div id="sidebar-header">
        <div style="display:flex;flex-direction:column;gap:.1rem;">
          <h1>✦ Games</h1>
          <p style="font-size:.75rem;margin:0;color:var(--muted);">All Games</p>
        </div>
        <div>
          <button id="open-grid-btn" title="Open games grid">Grid</button>
        </div>
      </div>
      <div id="sidebar-content">
        <ul id="sidebar-links">
          <li class="status-msg"><span class="spinner">⏳</span> Loading...</li>
        </ul>
      </div>
    </nav>

    <!-- conservative overlay: appears on top of the site when Grid is opened -->
    <div id="grid-overlay" aria-hidden="true">
      <div class="overlay-header">
        <div style="display:flex;align-items:center;gap:.6rem;"><h2 style="margin:0;font-size:1.1rem;">Games</h2><span style="color:var(--muted);font-size:.95rem">Browse</span></div>
        <div><button id="close-grid-btn" aria-label="Close grid" style="background:transparent;border:none;color:var(--muted);font-weight:700;cursor:pointer">✕</button></div>
      </div>
      <div id="overlay-games-grid" role="list"></div>
    </div>

    <div id="main-container">
      <header id="main-header">
        <div id="main-header-content">
          <h1 id="page-title">LearnGoose</h1>
          <p id="page-path">Welcome home</p>
        </div>

        <div class="header-actions">
          <button class="header-btn" type="button" id="fullscreen-btn">⛶ Fullscreen</button>
          <button class="header-btn secondary" type="button" id="logout-btn">🚪 Logout</button>
        </div>
      </header>

      <div id="home-page">
        <h2>Welcome to LearnGoose</h2>
        <p>Just do what you came here for lol.( 🏁 are the best choices for games. )</p>
        <button class="home-cta" onclick="document.querySelector('#sidebar-links a')?.click()">Totally Educational Games</button>
      </div>

      <iframe id="page-frame" title="Game Preview" style="display: none;"></iframe>
    </div>
  </div>

  <script>
    const owner = 'ProxyNoxy';
    const repo = 'proxynoxy.github.io';
    const SITE_PASSWORD = 'LearnGooseOnTop';
    const AUTH_KEY = 'proxynoxy_authenticated';
    const STATIC_HTML_FILES = [
      'pages/🏁CloudMoon.html',
      'pages/🏁Noahs_Tutoring.html',
      'pages/🏁Start_My_Education.html',
      'pages/🏁cherri.html',
      'pages/🏁galaxy.html',
      'pages/🏁yukiOS.html',
      'pages/rocket_goal.html',
      'pages/plants_vs_zombies.html',
      'pages/webdashers.html',
      'pages/mario.html',
      'pages/EaglercraftX.html',
      'pages/plague_inc.html',
      'pages/just_and_shapes_beats.html',
      'pages/granny_2.html',
      'pages/1v1lol.html',
      'pages/Minus_B.html',
      'pages/BTD5.html',
      'pages/Pneumonoultramicroscopicsilicovolcanoconiosis.html'
    ];

    const appEl = document.getElementById('app');
    const authScreen = document.getElementById('auth-screen');
    const authForm = document.getElementById('auth-form');
    const passwordInput = document.getElementById('password-input');
    const authError = document.getElementById('auth-error');
    const homePage = document.getElementById('home-page');
    const pageFrame = document.getElementById('page-frame');

    const openGridBtn = document.getElementById('open-grid-btn');
    const closeGridBtn = document.getElementById('close-grid-btn');
    const gridOverlay = document.getElementById('grid-overlay');
    const overlayGamesGrid = document.getElementById('overlay-games-grid');

    function unlockApp() {
      localStorage.setItem(AUTH_KEY, 'true');
      appEl.classList.add('unlocked');
      authScreen.classList.add('hidden');
      passwordInput.value = '';
      clearAuthError();
    }

    function lockApp() {
      localStorage.removeItem(AUTH_KEY);
      appEl.classList.remove('unlocked');
      authScreen.classList.remove('hidden');
      passwordInput.focus();
    }

    function isAuthenticated() {
      return localStorage.getItem(AUTH_KEY) === 'true';
    }

    function showAuthError(message) {
      authError.textContent = message;
      authError.classList.add('visible');
    }

    function clearAuthError() {
      authError.textContent = '';
      authError.classList.remove('visible');
    }

    function formatLabel(path) {
      const fileName = path.replace(/^.*\//, '').replace(/\.html$/i, '');
      return fileName
        .replace(/[-_]/g, ' ')
        .trim()
        .replace(/\b\w/g, char => char.toUpperCase());
    }

    function getThumbLetters(name) {
      return name.replace(/[^a-zA-Z0-9]/g, '').slice(0,2).toUpperCase() || 'GO';
    }

    function renderOverlayGrid() {
      if (!overlayGamesGrid) return;
      overlayGamesGrid.innerHTML = '';

      const files = STATIC_HTML_FILES.filter(f => f && f.toLowerCase().endsWith('.html'))
        .sort((a,b) => {
          const aName = a.replace(/^.*\//,'');
          const bName = b.replace(/^.*\//,'');
          return aName.localeCompare(bName);
        });

      files.forEach(file => {
        const name = formatLabel(file);
        const card = document.createElement('div');
        card.className = 'grid-card';

        const thumb = document.createElement('div');
        thumb.className = 'grid-thumb';
        thumb.textContent = getThumbLetters(name);

        const row = document.createElement('div');
        row.className = 'grid-row';
        const n = document.createElement('div'); n.className='grid-name'; n.textContent = name;
        const btn = document.createElement('button'); btn.className='grid-play'; btn.textContent='Play';
        btn.addEventListener('click', () => {
          closeOverlay();
          openPage(file);
        });

        row.appendChild(n);
        row.appendChild(btn);
        card.appendChild(thumb);
        card.appendChild(row);
        overlayGamesGrid.appendChild(card);
      });
    }

    function openOverlay() {
      renderOverlayGrid();
      gridOverlay.classList.add('visible');
      gridOverlay.setAttribute('aria-hidden','false');
      // keep focus on overlay for accessibility
      closeGridBtn.focus();
    }

    function closeOverlay() {
      gridOverlay.classList.remove('visible');
      gridOverlay.setAttribute('aria-hidden','true');
      // return focus back to the open button
      openGridBtn.focus();
    }

    function showHomePage() {
      homePage.style.display = 'flex';
      pageFrame.style.display = 'none';
      document.getElementById('page-title').textContent = 'LearnGoose';
      document.getElementById('page-path').textContent = 'Welcome home';
      setActiveLink(null);
    }

    function openPage(path) {
      const pageTitle = document.getElementById('page-title');
      const pagePath = document.getElementById('page-path');
      const pageUrl = `https://${owner.toLowerCase()}.github.io/${path}`;

      pageTitle.textContent = formatLabel(path);
      pagePath.textContent = formatLabel(path);
      pageFrame.src = pageUrl;
      homePage.style.display = 'none';
      pageFrame.style.display = 'block';
      setActiveLink(path);
    }

    async function toggleFullscreen() {
      const button = document.getElementById('fullscreen-btn');
      const target = pageFrame.style.display === 'none' ? document.getElementById('main-container') : pageFrame;

      if (!document.fullscreenElement) {
        try {
          if (target.requestFullscreen) {
            await target.requestFullscreen();
          } else if (document.documentElement.requestFullscreen) {
            await document.documentElement.requestFullscreen();
          }
        } catch (error) {
          console.error('Fullscreen failed:', error);
        }
      } else {
        try {
          await document.exitFullscreen();
        } catch (error) {
          console.error('Exit fullscreen failed:', error);
        }
      }

      if (button) {
        button.textContent = document.fullscreenElement ? '⤢ Exit Fullscreen' : '⛶ Fullscreen';
      }
    }

    function buildSidebar() {
      const sidebarEl = document.getElementById('sidebar-links');
      sidebarEl.innerHTML = '';

      if (!STATIC_HTML_FILES.length) {
        sidebarEl.innerHTML = '<li class="status-msg">📭 No games configured</li>';
        return;
      }

      const files = STATIC_HTML_FILES
        .filter(file => file && file.toLowerCase().endsWith('.html'));

      files.sort((a, b) => {
        const aName = a.replace(/^.*\//, '');
        const bName = b.replace(/^.*\//, '');
        const aFlag = aName.startsWith('🏁');
        const bFlag = bName.startsWith('🏁');

        if (aFlag !== bFlag) {
          return aFlag ? 1 : -1;
        }

        return aName.localeCompare(bName);
      });

      files.forEach(file => {
        const item = document.createElement('li');
        const link = document.createElement('a');

        link.href = '#';
        link.dataset.path = file;
        link.textContent = formatLabel(file);
        link.addEventListener('click', event => {
          event.preventDefault();
          openPage(file);
        });

        item.appendChild(link);
        sidebarEl.appendChild(item);
      });
    }

    function setActiveLink(path) {
      const links = document.querySelectorAll('#sidebar-links a');
      links.forEach(link => {
        const isActive = path && link.dataset.path === path;
        link.classList.toggle('active', isActive);
      });
    }

    // events
    authForm.addEventListener('submit', function (event) {
      event.preventDefault();

      const entered = passwordInput.value.trim();
      if (!entered) {
        showAuthError('Please enter a password.');
        return;
      }

      if (entered === SITE_PASSWORD) {
        unlockApp();
      } else {
        showAuthError('Incorrect password. Please try again.');
      }
    });

    document.getElementById('logout-btn').addEventListener('click', lockApp);
    document.getElementById('fullscreen-btn').addEventListener('click', toggleFullscreen);

    openGridBtn && openGridBtn.addEventListener('click', openOverlay);
    closeGridBtn && closeGridBtn.addEventListener('click', closeOverlay);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        // close overlay if open
        if (gridOverlay.classList.contains('visible')) closeOverlay();
      }
    });

    document.addEventListener('fullscreenchange', () => {
      const button = document.getElementById('fullscreen-btn');
      if (button) {
        button.textContent = document.fullscreenElement ? '⤢ Exit Fullscreen' : '⛶ Fullscreen';
      }
    });

    document.addEventListener('DOMContentLoaded', function () {
      if (isAuthenticated()) {
        unlockApp();
      } else {
        lockApp();
      }
      buildSidebar();
      showHomePage();
      if (!isAuthenticated()) {
        passwordInput.focus();
      }
    });
  </script>
</body>
</html>
