<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProxyNoxy's Projects</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #ff006e;
      --primary-dark: #d60056;
      --primary-light: #ff4d94;
      --bg-dark: #0a0e27;
      --bg-secondary: #1a1f3a;
      --bg-tertiary: #2a3050;
      --text-primary: #ffffff;
      --text-secondary: #e0e0e0;
      --text-muted: #a0a0a0;
      --border-color: #3a4060;
      --accent: #ff006e;
      --danger: #ff1744;
      --panel: rgba(10, 14, 39, 0.95);
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Oxygen", "Ubuntu", sans-serif;
      background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #ff006e 100%);
      color: var(--text-primary);
      display: flex;
      flex-direction: row;
    }

    #app {
      display: flex;
      width: 100%;
      height: 100%;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    #app.unlocked {
      opacity: 1;
      pointer-events: auto;
    }

    #sidebar {
      width: 300px;
      height: 100vh;
      background: linear-gradient(180deg, var(--bg-secondary) 0%, var(--bg-dark) 100%);
      border-right: 2px solid var(--primary);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 4px 0 30px rgba(255, 0, 110, 0.2);
      flex-shrink: 0;
    }

    #sidebar-header {
      padding: 2rem 1.5rem;
      border-bottom: 2px solid var(--primary);
      background: linear-gradient(135deg, rgba(255, 0, 110, 0.15) 0%, rgba(255, 77, 148, 0.1) 100%);
    }

    #sidebar-header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    #sidebar-header p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin: 0;
    }

    #sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem 0;
    }

    #sidebar-content::-webkit-scrollbar {
      width: 6px;
    }

    #sidebar-content::-webkit-scrollbar-track {
      background: transparent;
    }

    #sidebar-content::-webkit-scrollbar-thumb {
      background: var(--primary);
      border-radius: 3px;
    }

    #sidebar-content::-webkit-scrollbar-thumb:hover {
      background: var(--primary-light);
    }

    #sidebar-links {
      list-style: none;
      padding: 0 1rem;
    }

    #sidebar-links li {
      margin-bottom: 0.75rem;
    }

    #sidebar-links a {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.875rem 1rem;
      border-radius: 8px;
      text-decoration: none;
      color: var(--text-secondary);
      font-size: 0.95rem;
      font-weight: 500;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      border-left: 3px solid transparent;
      cursor: pointer;
      word-break: break-word;
    }

    #sidebar-links a::before {
      content: "📄";
      font-size: 1rem;
      flex-shrink: 0;
    }

    #sidebar-links a:hover {
      background: rgba(255, 0, 110, 0.15);
      color: var(--primary-light);
      border-left-color: var(--primary-light);
      transform: translateX(4px);
    }

    #sidebar-links a.active {
      background: linear-gradient(135deg, rgba(255, 0, 110, 0.3) 0%, rgba(255, 77, 148, 0.15) 100%);
      color: var(--primary-light);
      border-left-color: var(--primary);
      box-shadow: 0 4px 12px rgba(255, 0, 110, 0.3);
    }

    .status-msg {
      padding: 1rem 1.5rem;
      color: var(--text-muted);
      font-size: 0.9rem;
      text-align: center;
      font-style: italic;
    }

    #main-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    #main-header {
      padding: 1.5rem 2rem;
      background: linear-gradient(135deg, rgba(255, 0, 110, 0.2) 0%, rgba(255, 77, 148, 0.1) 100%);
      border-bottom: 2px solid var(--primary);
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 20px rgba(255, 0, 110, 0.15);
      gap: 1rem;
      flex-wrap: wrap;
    }

    #main-header-content h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin: 0;
      background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    #main-header-content p {
      margin: 0.25rem 0 0 0;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .header-btn,
    #auth-form button {
      appearance: none;
      border: 1px solid rgba(255, 0, 110, 0.7);
      background: linear-gradient(135deg, rgba(255, 0, 110, 0.2) 0%, rgba(255, 77, 148, 0.15) 100%);
      color: var(--text-primary);
      font-weight: 600;
      padding: 0.75rem 1.1rem;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 0.9rem;
      white-space: nowrap;
    }

    .header-btn.secondary {
      background: rgba(160, 160, 160, 0.08);
      border-color: rgba(160, 160, 160, 0.4);
    }

    .header-btn:hover,
    #auth-form button:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(255, 0, 110, 0.3);
      border-color: var(--primary-light);
    }

    #page-frame {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
      background: var(--bg-dark);
      overflow: hidden;
    }

    #home-page {
      flex: 1;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 2rem;
      background: linear-gradient(135deg, rgba(10, 14, 39, 0.8) 0%, rgba(26, 31, 58, 0.8) 50%, rgba(255, 0, 110, 0.1) 100%);
      overflow-y: auto;
    }

    #home-page h2 {
      font-size: 3rem;
      font-weight: 800;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-align: center;
    }

    #home-page p {
      font-size: 1.2rem;
      color: var(--text-secondary);
      text-align: center;
      max-width: 600px;
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    #home-page .home-cta {
      display: inline-block;
      padding: 1rem 2rem;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 10px 30px rgba(255, 0, 110, 0.3);
    }

    #home-page .home-cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 40px rgba(255, 0, 110, 0.4);
    }

    #auth-screen {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, rgba(255, 0, 110, 0.2), rgba(10, 14, 39, 0.95)),
                  linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      transition: opacity 0.25s ease;
    }

    #auth-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #auth-card {
      width: min(420px, calc(100vw - 2rem));
      background: var(--panel);
      border: 1px solid rgba(255, 0, 110, 0.3);
      border-radius: 20px;
      box-shadow: 0 25px 60px rgba(255, 0, 110, 0.15), 0 0 40px rgba(255, 0, 110, 0.1);
      padding: 2rem;
    }

    #auth-card h2 {
      margin: 0 0 0.35rem 0;
      font-size: 1.8rem;
      background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    #auth-card p {
      color: var(--text-muted);
      margin-bottom: 1.25rem;
      line-height: 1.5;
    }

    #auth-form {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    #auth-form label {
      color: var(--text-secondary);
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    #auth-form input {
      width: 100%;
      border: 1px solid rgba(255, 0, 110, 0.4);
      background: rgba(10, 14, 39, 0.9);
      color: var(--text-primary);
      border-radius: 10px;
      padding: 0.9rem 1rem;
      font-size: 1rem;
      outline: none;
      transition: border 0.2s ease, box-shadow 0.2s ease;
    }

    #auth-form input:focus {
      border-color: var(--primary-light);
      box-shadow: 0 0 0 3px rgba(255, 0, 110, 0.2);
    }

    #auth-form button {
      margin-top: 0.35rem;
      font-size: 1rem;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      border: 1px solid var(--primary);
    }

    #auth-error {
      min-height: 1.1rem;
      font-size: 0.85rem;
      color: #ff6b9d;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    #auth-error.visible {
      opacity: 1;
    }

    @media (max-width: 1024px) {
      #sidebar {
        width: 250px;
      }

      #main-header {
        padding: 1rem 1.5rem;
      }

      #main-header-content h1 {
        font-size: 1.5rem;
      }
    }

    @media (max-width: 768px) {
      body {
        flex-direction: column;
      }

      #app {
        flex-direction: column;
      }

      #sidebar {
        width: 100%;
        height: auto;
        max-height: 40vh;
        border-right: none;
        border-bottom: 2px solid var(--primary);
      }

      #sidebar-content {
        max-height: 30vh;
      }

      #main-container {
        height: 60vh;
      }

      #main-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.5rem;
      }

      #home-page h2 {
        font-size: 2rem;
      }

      #home-page p {
        font-size: 1rem;
      }
    }

    .spinner {
      display: inline-block;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    #sidebar-links li {
      animation: fadeIn 0.3s ease-out forwards;
    }

    #sidebar-links li:nth-child(1) { animation-delay: 0s; }
    #sidebar-links li:nth-child(2) { animation-delay: 0.05s; }
    #sidebar-links li:nth-child(3) { animation-delay: 0.1s; }
    #sidebar-links li:nth-child(n+4) { animation-delay: 0.15s; }
  </style>
</head>
<body>
  <div id="auth-screen">
    <div id="auth-card">
      <h2>Access required</h2>
      <p>Enter the password to view the project pages.</p>

      <form id="auth-form">
        <label for="password-input">Password</label>
        <input id="password-input" type="password" autocomplete="current-password" placeholder="Enter password" />
        <div id="auth-error" aria-live="polite"></div>
        <button type="submit">Unlock</button>
      </form>
    </div>
  </div>

  <div id="app">
    <nav id="sidebar">
      <div id="sidebar-header">
        <h1>🎨 Projects</h1>
        <p>Your HTML Pages</p>
      </div>
      <div id="sidebar-content">
        <ul id="sidebar-links">
          <li class="status-msg"><span class="spinner">⏳</span> Loading...</li>
        </ul>
      </div>
    </nav>

    <div id="main-container">
      <header id="main-header">
        <div id="main-header-content">
          <h1 id="page-title">ProxyNoxy's Projects</h1>
          <p id="page-path">Welcome home</p>
        </div>

        <div class="header-actions">
          <button class="header-btn" type="button" id="fullscreen-btn">⛶ Fullscreen</button>
          <button class="header-btn secondary" type="button" id="logout-btn">🚪 Logout</button>
        </div>
      </header>
      
      <div id="home-page">
        <h2>Welcome to ProxyNoxy</h2>
        <p>Select a project from the sidebar to get started. Explore a collection of interactive web applications and games.</p>
        <button class="home-cta" onclick="document.querySelector('#sidebar-links a').click()">Explore Projects</button>
      </div>
      
      <iframe id="page-frame" title="Project Preview" style="display: none;"></iframe>
    </div>
  </div>

  <script>
    const owner = 'ProxyNoxy';
    const repo = 'proxynoxy.github.io';
    const SITE_PASSWORD = 'proxynoxy';
    const AUTH_KEY = 'proxynoxy_authenticated';
    const STATIC_HTML_FILES = [
      'pages/CloudMoon.html',
      'pages/NoahsTutoring.html',
      'pages/StartMyEducation.html',
      'pages/cherri.html',
      'pages/galaxy.html',
      'pages/yukiOS.html'
    ];

    const appEl = document.getElementById('app');
    const authScreen = document.getElementById('auth-screen');
    const authForm = document.getElementById('auth-form');
    const passwordInput = document.getElementById('password-input');
    const authError = document.getElementById('auth-error');
    const homePage = document.getElementById('home-page');
    const pageFrame = document.getElementById('page-frame');

    function unlockApp() {
      localStorage.setItem(AUTH_KEY, 'true');
      appEl.classList.add('unlocked');
      authScreen.classList.add('hidden');
      passwordInput.value = '';
      clearAuthError();
    }

    function lockApp() {
      localStorage.removeItem(AUTH_KEY);
      appEl.classList.remove('unlocked');
      authScreen.classList.remove('hidden');
      passwordInput.focus();
    }

    function isAuthenticated() {
      return localStorage.getItem(AUTH_KEY) === 'true';
    }

    function showAuthError(message) {
      authError.textContent = message;
      authError.classList.add('visible');
    }

    function clearAuthError() {
      authError.textContent = '';
      authError.classList.remove('visible');
    }

    function formatLabel(path) {
      const fileName = path.replace(/^.*\//, '').replace(/\.html$/i, '');
      return fileName
        .replace(/[-_]/g, ' ')
        .trim()
        .replace(/\b\w/g, char => char.toUpperCase());
    }

    function showHomePage() {
      homePage.style.display = 'flex';
      pageFrame.style.display = 'none';
      document.getElementById('page-title').textContent = "ProxyNoxy's Projects";
      document.getElementById('page-path').textContent = 'Welcome home';
      setActiveLink(null);
    }

    function openPage(path) {
      const pageTitle = document.getElementById('page-title');
      const pagePath = document.getElementById('page-path');
      const pageUrl = `https://${owner.toLowerCase()}.github.io/${path}`;

      pageTitle.textContent = formatLabel(path);
      pagePath.textContent = `📍 ${path}`;
      pageFrame.src = pageUrl;
      homePage.style.display = 'none';
      pageFrame.style.display = 'block';
      setActiveLink(path);
    }

    async function toggleFullscreen() {
      const button = document.getElementById('fullscreen-btn');
      const target = pageFrame.style.display === 'none' ? document.getElementById('main-container') : pageFrame;

      if (!document.fullscreenElement) {
        try {
          if (target.requestFullscreen) {
            await target.requestFullscreen();
          } else if (document.documentElement.requestFullscreen) {
            await document.documentElement.requestFullscreen();
          }
        } catch (error) {
          console.error('Fullscreen failed:', error);
        }
      } else {
        try {
          await document.exitFullscreen();
        } catch (error) {
          console.error('Exit fullscreen failed:', error);
        }
      }

      if (button) {
        button.textContent = document.fullscreenElement ? '⤢ Exit Fullscreen' : '⛶ Fullscreen';
      }
    }

    function buildSidebar() {
      const sidebarEl = document.getElementById('sidebar-links');
      sidebarEl.innerHTML = '';

      if (!STATIC_HTML_FILES.length) {
        sidebarEl.innerHTML = '<li class="status-msg">📭 No HTML pages configured</li>';
        return;
      }

      STATIC_HTML_FILES
        .filter(file => file && file.toLowerCase().endsWith('.html'))
        .sort((a, b) => a.localeCompare(b))
        .forEach(file => {
          const item = document.createElement('li');
          const link = document.createElement('a');

          link.href = '#';
          link.dataset.path = file;
          link.textContent = formatLabel(file);
          link.addEventListener('click', event => {
            event.preventDefault();
            openPage(file);
          });

          item.appendChild(link);
          sidebarEl.appendChild(item);
        });
    }

    authForm.addEventListener('submit', function (event) {
      event.preventDefault();

      const entered = passwordInput.value.trim();
      if (!entered) {
        showAuthError('Please enter a password.');
        return;
      }

      if (entered === SITE_PASSWORD) {
        unlockApp();
      } else {
        showAuthError('Incorrect password. Please try again.');
      }
    });

    document.getElementById('logout-btn').addEventListener('click', lockApp);
    document.getElementById('fullscreen-btn').addEventListener('click', toggleFullscreen);

    document.addEventListener('fullscreenchange', () => {
      const button = document.getElementById('fullscreen-btn');
      if (button) {
        button.textContent = document.fullscreenElement ? '⤢ Exit Fullscreen' : '⛶ Fullscreen';
      }
    });

    document.addEventListener('DOMContentLoaded', function () {
      if (isAuthenticated()) {
        unlockApp();
      } else {
        lockApp();
      }
      buildSidebar();
      showHomePage();
      if (!isAuthenticated()) {
        passwordInput.focus();
      }
    });
  </script>
</body>
</html>
