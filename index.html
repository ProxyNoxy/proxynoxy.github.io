<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My GitHub Website</title>
  <style>
    /* Basic Layout Setup */
    body {
      font-family: sans-serif;
      margin: 0;
      display: flex;
    }
    
    /* Sidebar Styling */
    #sidebar {
      width: 250px;
      background-color: #f4f4f4;
      padding: 20px;
      height: 100vh;
      box-sizing: border-box;
      border-right: 1px solid #ddd;
    }
    
    #sidebar h3 {
      margin-top: 0;
    }
    
    #sidebar-links {
      list-style-type: none;
      padding: 0;
    }
    
    #sidebar-links li {
      margin-bottom: 10px;
    }
    
    #sidebar-links a {
      text-decoration: none;
      color: #333;
    }
    
    #sidebar-links a:hover {
      color: #0066cc;
    }
    
    /* Main Content Styling */
    #main-content {
      flex-grow: 1;
      padding: 20px;
    }
  </style>
</head>
<body>

  <!-- Sidebar Component -->
  <div id="sidebar">
    <h3>Documentation</h3>
    <ul id="sidebar-links">
      <li>Loading pages...</li>
    </ul>
  </div>

  <!-- Main Content Area -->
  <div id="main-content">
    <h1>Welcome to My Website</h1>
    <p>The sidebar on the left dynamically updates by fetching all HTML files inside this GitHub repository.</p>
  </div>

  <!-- JavaScript Logic -->
  <script>
    async function loadSidebar() {
      // CHANGE THESE TO YOUR GITHUB DETAILS
      const username = 'ProxyNoxy'; 
      const repo = 'proxynoxy.github.io';
      
      // Fetches the repository directory structure via GitHub API
      const url = `https://github.com{username}/${repo}/git/trees/main?recursive=1`;

      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error('Failed to fetch repo data');
        
        const data = await response.json();
        const sidebarEl = document.getElementById('sidebar-links');
        sidebarEl.innerHTML = ''; // Clear the loading placeholder

        // Filter for files ending in .html, skipping this main index file
        const htmlFiles = data.tree.filter(file => 
          file.path.endsWith('.html') && file.path !== 'index.html'
        );

        if (htmlFiles.length === 0) {
          sidebarEl.innerHTML = '<li>No other pages found.</li>';
          return;
        }

        // Build list elements for every HTML file discovered
        htmlFiles.forEach(file => {
          const listItem = document.createElement('li');
          const link = document.createElement('a');
          
          link.href = file.path;
          // Clean up the text by removing the extension and replacing dashes/underscores with spaces
          link.textContent = file.path.replace('.html', '').replace(/[-_]/g, ' '); 
          
          listItem.appendChild(link);
          sidebarEl.appendChild(listItem);
        });
      } catch (error) {
        console.error('Error fetching repository files:', error);
        document.getElementById('sidebar-links').innerHTML = '<li>Error loading menu.</li>';
      }
    }

    // Initialize the script when the DOM is ready
    document.addEventListener('DOMContentLoaded', loadSidebar);
  </script>
</body>
</html>
