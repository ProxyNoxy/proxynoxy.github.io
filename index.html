<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="LearnGoose — browser games hub.">
  <meta name="theme-color" content="#ff006e">
  <meta property="og:title" content="LearnGoose">
  <meta property="og:description" content="W LearnGoose.">
  <meta property="og:type" content="website">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>LearnGoose</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #ff8bc7;
      --primary-2: #ffc1e3;
      --primary-3: #8ae7ff;
      --bg-1: #0d1020;
      --bg-2: #171b38;
      --bg-3: #232b56;
      --panel: rgba(18, 22, 38, 0.66);
      --panel-strong: rgba(20, 25, 46, 0.8);
      --line: rgba(255, 255, 255, 0.1);
      --text: #f4f7ff;
      --muted: #c4cde8;
      --soft: #edf4ff;
      --shadow: rgba(135, 94, 255, 0.28);
      --spectrum-duration: 28s;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      position: relative;
      isolation: isolate;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Oxygen", "Ubuntu", sans-serif;
      color: var(--text);
      display: flex;
      flex-direction: row;
      background: var(--bg-1);
    }

    body::before {
      content: "";
      position: fixed;
      inset: -20%;
      z-index: -1;
      pointer-events: none;
      background:
        linear-gradient(
          120deg,
          hsl(0 95% 60%),
          hsl(35 95% 62%),
          hsl(70 95% 58%),
          hsl(120 95% 58%),
          hsl(175 95% 55%),
          hsl(220 95% 60%),
          hsl(270 90% 62%),
          hsl(315 95% 60%),
          hsl(360 95% 60%)
        );
      background-size: 250% 250%;
      filter: saturate(1.05) brightness(0.28);
      mix-blend-mode: screen;
      animation: spectrumFade var(--spectrum-duration) ease-in-out infinite alternate;
      opacity: 0.12;
    }

    .spectrum-bg {
      background-image: linear-gradient(120deg,
        hsl(0 95% 60%),
        hsl(35 95% 62%),
        hsl(70 95% 58%),
        hsl(120 95% 58%),
        hsl(175 95% 55%),
        hsl(220 95% 60%),
        hsl(270 90% 62%),
        hsl(315 95% 60%),
        hsl(360 95% 60%));
      background-size: 250% 250%;
      animation: spectrumFade var(--spectrum-duration) ease-in-out infinite alternate;
    }

    .spectrum-text {
      background-image: linear-gradient(135deg,
        hsl(0 95% 60%),
        hsl(35 95% 62%),
        hsl(70 95% 58%),
        hsl(120 95% 58%),
        hsl(175 95% 55%),
        hsl(220 95% 60%));
      background-size: 300% 300%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: spectrumFade var(--spectrum-duration) linear infinite;
      text-shadow: 0 0 14px rgba(255,255,255,0.04);
    }

    @keyframes spectrumFade {
      0% {
        background-position: 0% 50%;
        filter: hue-rotate(0deg) saturate(1.1) brightness(1.08);
      }
      25% {
        background-position: 35% 30%;
        filter: hue-rotate(80deg) saturate(1.25) brightness(1.12);
      }
      50% {
        background-position: 100% 50%;
        filter: hue-rotate(180deg) saturate(1.3) brightness(1.14);
      }
      75% {
        background-position: 60% 80%;
        filter: hue-rotate(260deg) saturate(1.2) brightness(1.12);
      }
      100% {
        background-position: 0% 50%;
        filter: hue-rotate(360deg) saturate(1.1) brightness(1.08);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      body::before {
        animation: none;
      }
      .spectrum-bg,
      .spectrum-text {
        animation: none;
      }
    }

    #app {
      display: flex;
      width: 100%;
      height: 100%;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    #app.unlocked {
      opacity: 1;
      pointer-events: auto;
    }

    #sidebar {
      width: 300px;
      height: 100vh;
      background: rgba(13, 17, 30, 0.74);
      border-right: 1px solid var(--line);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 18px 0 36px rgba(7, 9, 20, 0.3);
      flex-shrink: 0;
      position: relative;
      z-index: 10;
    }

    #sidebar-header {
      padding: 1.2rem 1rem;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255, 139, 199, 0.06), rgba(138, 231, 255, 0.02));
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.02);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    #sidebar-header h1 {
      font-size: 1.1rem;
      font-weight: 800;
      margin: 0;
      background-image: linear-gradient(135deg, hsl(320 95% 70%), hsl(200 95% 65%), hsl(20 95% 65%));
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 0 12px rgba(255, 139, 199, 0.08);
    }

    #sidebar-header .sidebar-actions {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    #sidebar-header p { display: none; }

    #open-grid-btn {
      appearance: none;
      border: 1px solid rgba(255,255,255,0.06);
      background: rgba(255,255,255,0.02);
      color: var(--soft);
      padding: 0.45rem 0.6rem;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
    }

    #sidebar-overlay {
      position: fixed;
      inset: 0 0 0 0;
      z-index: 1200;
      background: rgba(8,10,18,0.96);
      transform: translateX(-110%);
      transition: transform 360ms cubic-bezier(.2,.9,.1,1);
      display: flex;
      flex-direction: column;
      padding: 1.2rem;
      pointer-events: none;
    }

    #sidebar-overlay.visible {
      transform: translateX(0);
      pointer-events: auto;
    }

    #sidebar-overlay .overlay-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    #close-grid-btn {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--muted);
      font-weight: 700;
      cursor: pointer;
      padding: 0.5rem 0.75rem;
      border-radius: 10px;
    }

    .games-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
      margin-top: 0.5rem;
    }

    .game-card {
      background: rgba(17, 21, 37, 0.78);
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 26px rgba(0,0,0,0.22);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      display: flex;
      flex-direction: column;
      min-height: 80px;
    }

    .game-thumb {
      aspect-ratio: 16 / 10;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, rgba(255,139,199,0.14), rgba(138,231,255,0.08));
      font-size: 1.6rem;
      font-weight: 800;
      color: rgba(255,255,255,0.92);
      letter-spacing: 0.04em;
    }

    .game-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
      padding: 0.7rem 0.75rem;
    }

    .game-name {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--soft);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .play-btn {
      appearance: none;
      border: none;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-2) 100%);
      color: white;
      font-weight: 800;
      padding: 0.6rem 0.9rem;
      border-radius: 10px;
      cursor: pointer;
      transition: filter 0.16s ease, transform 0.16s ease;
      white-space: nowrap;
    }

    .play-btn:hover { transform: translateY(-2px); }

    /* keep home page unchanged */
    #home-page { flex-direction: column; }

    @media (max-width: 768px) {
      #sidebar { width: 100%; height: auto; max-height: 40vh; }
      #sidebar-overlay { padding: 0.8rem; }
      .games-grid { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
    }
  </style>
</head>
<body>
  <div id="auth-screen">
    <div id="auth-card">
      <h2>Access required</h2>
      <p>Enter the password to view the game pages.</p>

      <form id="auth-form">
        <label for="password-input">Password</label>
        <input id="password-input" type="password" autocomplete="current-password" placeholder="Enter password" />
        <div id="auth-error" aria-live="polite"></div>
        <button type="submit">Unlock</button>
      </form>
    </div>
  </div>

  <div id="app">
    <nav id="sidebar">
      <div id="sidebar-header">
        <div>
          <h1>✦ Games</h1>
          <p>All Games</p>
        </div>
        <div class="sidebar-actions">
          <button id="open-grid-btn" title="Open games grid">☰ Grid</button>
        </div>
      </div>
      <div id="sidebar-content">
        <ul id="sidebar-links">
          <li class="status-msg"><span class="spinner">⏳</span> Loading...</li>
        </ul>
      </div>
    </nav>

    <!-- full-screen overlay used when the sidebar expands into the grid view -->
    <div id="sidebar-overlay" aria-hidden="true">
      <div class="overlay-header">
        <div style="display:flex;align-items:center;gap:.6rem;">
          <h2 style="margin:0;font-size:1.1rem;">Games</h2>
          <p style="margin:0;color:var(--muted);font-size:.9rem;">Browse</p>
        </div>
        <div>
          <button id="close-grid-btn" aria-label="Close grid">✕</button>
        </div>
      </div>
      <div id="sidebar-games-grid" class="games-grid" role="list"></div>
    </div>

    <div id="main-container">
      <header id="main-header">
        <div id="main-header-content">
          <h1 id="page-title">LearnGoose</h1>
          <p id="page-path">Welcome home</p>
        </div>

        <div class="header-actions">
          <button class="header-btn" type="button" id="fullscreen-btn">⛶ Fullscreen</button>
          <button class="header-btn secondary" type="button" id="logout-btn">🚪 Logout</button>
        </div>
      </header>

      <div id="home-page">
        <h2>Welcome to LearnGoose</h2>
        <p>Just do what you came here for lol.( 🏁 are the best choices for games. )</p>
        <button class="home-cta" onclick="document.querySelector('#sidebar-links a')?.click()">Totally Educational Games</button>
      </div>

      <iframe id="page-frame" title="Game Preview" style="display: none;"></iframe>
    </div>
  </div>

  <script>
    const owner = 'ProxyNoxy';
    const repo = 'proxynoxy.github.io';
    const SITE_PASSWORD = 'LearnGooseOnTop';
    const AUTH_KEY = 'proxynoxy_authenticated';
    const STATIC_HTML_FILES = [
      'pages/🏁CloudMoon.html',
      'pages/🏁Noahs_Tutoring.html',
      'pages/🏁Start_My_Education.html',
      'pages/🏁cherri.html',
      'pages/🏁galaxy.html',
      'pages/🏁yukiOS.html',
      'pages/rocket_goal.html',
      'pages/plants_vs_zombies.html',
      'pages/webdashers.html',
      'pages/mario.html',
      'pages/EaglercraftX.html',
      'pages/plague_inc.html',
      'pages/just_and_shapes_beats.html',
      'pages/granny_2.html',
      'pages/1v1lol.html',
      'pages/Minus_B.html',
      'pages/BTD5.html',
      'pages/Pneumonoultramicroscopicsilicovolcanoconiosis.html'
    ];

    const appEl = document.getElementById('app');
    const authScreen = document.getElementById('auth-screen');
    const authForm = document.getElementById('auth-form');
    const passwordInput = document.getElementById('password-input');
    const authError = document.getElementById('auth-error');
    const homePage = document.getElementById('home-page');
    const pageFrame = document.getElementById('page-frame');
    const gamesGrid = document.getElementById('sidebar-games-grid');
    const sidebarOverlay = document.getElementById('sidebar-overlay');
    const openGridBtn = document.getElementById('open-grid-btn');
    const closeGridBtn = document.getElementById('close-grid-btn');

    function unlockApp() {
      localStorage.setItem(AUTH_KEY, 'true');
      appEl.classList.add('unlocked');
      authScreen.classList.add('hidden');
      passwordInput.value = '';
      clearAuthError();
    }

    function lockApp() {
      localStorage.removeItem(AUTH_KEY);
      appEl.classList.remove('unlocked');
      authScreen.classList.remove('hidden');
      passwordInput.focus();
    }

    function isAuthenticated() {
      return localStorage.getItem(AUTH_KEY) === 'true';
    }

    function showAuthError(message) {
      authError.textContent = message;
      authError.classList.add('visible');
    }

    function clearAuthError() {
      authError.textContent = '';
      authError.classList.remove('visible');
    }

    function formatLabel(path) {
      const fileName = path.replace(/^.*\//, '').replace(/\.html$/i, '');
      return fileName
        .replace(/[-_]/g, ' ')
        .trim()
        .replace(/\b\w/g, char => char.toUpperCase());
    }

    function getGameThumbLabel(name) {
      const letters = name.replace(/[^a-zA-Z0-9]/g, '').slice(0, 2).toUpperCase();
      return letters || 'GO';
    }

    function renderSidebarGrid() {
      if (!gamesGrid) return;
      gamesGrid.innerHTML = '';

      const files = STATIC_HTML_FILES
        .filter(file => file && file.toLowerCase().endsWith('.html'))
        .sort((a, b) => {
          const aName = a.replace(/^.*\//, '');
          const bName = b.replace(/^.*\//, '');
          const aFlag = aName.startsWith('🏁');
          const bFlag = bName.startsWith('🏁');

          if (aFlag !== bFlag) return aFlag ? 1 : -1;
          return aName.localeCompare(bName);
        });

      files.forEach(file => {
        const name = formatLabel(file);
        const card = document.createElement('div');
        card.className = 'game-card';

        const thumb = document.createElement('div');
        thumb.className = 'game-thumb';
        thumb.textContent = getGameThumbLabel(name);

        const info = document.createElement('div');
        info.className = 'game-info';

        const title = document.createElement('div');
        title.className = 'game-name';
        title.textContent = name;

        const button = document.createElement('button');
        button.className = 'play-btn';
        button.type = 'button';
        button.textContent = 'Play';
        button.addEventListener('click', () => {
          closeSidebarGrid();
          openPage(file);
        });

        info.appendChild(title);
        info.appendChild(button);
        card.appendChild(thumb);
        card.appendChild(info);
        gamesGrid.appendChild(card);
      });
    }

    function openSidebarGrid() {
      sidebarOverlay.classList.add('visible');
      sidebarOverlay.setAttribute('aria-hidden', 'false');
      renderSidebarGrid();
      // optional: trap focus or other accessibility behaviors could be added here
    }

    function closeSidebarGrid() {
      sidebarOverlay.classList.remove('visible');
      sidebarOverlay.setAttribute('aria-hidden', 'true');
    }

    function showHomePage() {
      homePage.style.display = 'flex';
      pageFrame.style.display = 'none';
      document.getElementById('page-title').textContent = 'LearnGoose';
      document.getElementById('page-path').textContent = 'Welcome home';
      setActiveLink(null);
    }

    function openPage(path) {
      const pageTitle = document.getElementById('page-title');
      const pagePath = document.getElementById('page-path');
      const pageUrl = `https://${owner.toLowerCase()}.github.io/${path}`;

      pageTitle.textContent = formatLabel(path);
      pagePath.textContent = formatLabel(path);
      pageFrame.src = pageUrl;
      homePage.style.display = 'none';
      pageFrame.style.display = 'block';
      setActiveLink(path);
    }

    async function toggleFullscreen() {
      const button = document.getElementById('fullscreen-btn');
      const target = pageFrame.style.display === 'none' ? document.getElementById('main-container') : pageFrame;

      if (!document.fullscreenElement) {
        try {
          if (target.requestFullscreen) {
            await target.requestFullscreen();
          } else if (document.documentElement.requestFullscreen) {
            await document.documentElement.requestFullscreen();
          }
        } catch (error) {
          console.error('Fullscreen failed:', error);
        }
      } else {
        try {
          await document.exitFullscreen();
        } catch (error) {
          console.error('Exit fullscreen failed:', error);
        }
      }

      if (button) {
        button.textContent = document.fullscreenElement ? '⤢ Exit Fullscreen' : '⛶ Fullscreen';
      }
    }

    function buildSidebar() {
      const sidebarEl = document.getElementById('sidebar-links');
      sidebarEl.innerHTML = '';

      if (!STATIC_HTML_FILES.length) {
        sidebarEl.innerHTML = '<li class="status-msg">📭 No games configured</li>';
        return;
      }

      const files = STATIC_HTML_FILES
        .filter(file => file && file.toLowerCase().endsWith('.html'))
        .sort((a, b) => {
          const aName = a.replace(/^.*\//, '');
          const bName = b.replace(/^.*\//, '');
          const aFlag = aName.startsWith('🏁');
          const bFlag = bName.startsWith('🏁');

          if (aFlag !== bFlag) return aFlag ? 1 : -1;
          return aName.localeCompare(bName);
        });

      files.forEach(file => {
        const item = document.createElement('li');
        const link = document.createElement('a');

        link.href = '#';
        link.dataset.path = file;
        link.textContent = formatLabel(file);
        link.addEventListener('click', event => {
          event.preventDefault();
          openPage(file);
        });

        item.appendChild(link);
        sidebarEl.appendChild(item);
      });
    }

    function setActiveLink(path) {
      const links = document.querySelectorAll('#sidebar-links a');
      links.forEach(link => {
        const isActive = path && link.dataset.path === path;
        link.classList.toggle('active', isActive);
      });
    }

    authForm.addEventListener('submit', function (event) {
      event.preventDefault();

      const entered = passwordInput.value.trim();
      if (!entered) {
        showAuthError('Please enter a password.');
        return;
      }

      if (entered === SITE_PASSWORD) {
        unlockApp();
      } else {
        showAuthError('Incorrect password. Please try again.');
      }
    });

    document.getElementById('logout-btn').addEventListener('click', lockApp);
    document.getElementById('fullscreen-btn').addEventListener('click', toggleFullscreen);
    openGridBtn.addEventListener('click', openSidebarGrid);
    closeGridBtn.addEventListener('click', closeSidebarGrid);

    document.addEventListener('fullscreenchange', () => {
      const button = document.getElementById('fullscreen-btn');
      if (button) {
        button.textContent = document.fullscreenElement ? '⤢ Exit Fullscreen' : '⛶ Fullscreen';
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeSidebarGrid();
    });

    document.addEventListener('DOMContentLoaded', function () {
      if (isAuthenticated()) {
        unlockApp();
      } else {
        lockApp();
      }
      buildSidebar();
      showHomePage();
      if (!isAuthenticated()) {
        passwordInput.focus();
      }
    });
  </script>
</body>
</html>
