<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LearnGoose</title>
  <style>
    :root {
      --bg-main: #f8f9fa;
      --bg-sidebar: #ffffff;
      --text-main: #212529;
      --text-muted: #6c757d;
      --primary: #0969da;
      --primary-hover: #054da7;
      --border-color: #d0d7de;
      --accent-bg: #f6f8fa;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      min-height: 100vh;
      background-color: var(--bg-main);
      color: var(--text-main);
    }

    #sidebar {
      width: 280px;
      background-color: var(--bg-sidebar);
      padding: 2rem 1.5rem;
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    #sidebar h3 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05rem;
      color: var(--text-muted);
      margin-top: 0;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border-color);
    }

    #sidebar-links {
      list-style-type: none;
      padding: 0;
      margin: 0;
    }

    #sidebar-links li {
      margin-bottom: 0.4rem;
    }

    #sidebar-links a {
      display: flex;
      align-items: center;
      text-decoration: none;
      color: var(--text-main);
      padding: 0.6rem 0.75rem;
      border-radius: 6px;
      font-size: 0.95rem;
      transition: all 0.2s ease;
      word-break: break-word;
    }

    #sidebar-links a::before {
      content: "📄";
      margin-right: 0.5rem;
      font-size: 0.85rem;
      opacity: 0.7;
    }

    #sidebar-links a:hover,
    #sidebar-links a.active {
      background-color: var(--accent-bg);
      color: var(--primary);
      transform: translateX(4px);
    }

    .status-msg {
      font-size: 0.9rem;
      color: var(--text-muted);
      font-style: italic;
      padding: 0.5rem;
    }

    #main-content {
      flex-grow: 1;
      padding: 3rem;
      max-width: 900px;
    }

    #main-content h1 {
      font-size: 2.25rem;
      font-weight: 600;
      margin-top: 0;
      margin-bottom: 1rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.5rem;
    }

    #main-content p {
      font-size: 1.1rem;
      line-height: 1.6;
      color: #3f444e;
    }

    #page-frame {
      width: 100%;
      height: 75vh;
      margin-top: 1.5rem;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: white;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      display: none;
    }

    @media (max-width: 768px) {
      body { flex-direction: column; }

      #sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid var(--border-color);
      }

      #main-content {
        padding: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <nav id="sidebar">
    <h3>Project Pages</h3>
    <ul id="sidebar-links">
      <li class="status-msg">Scanning repository...</li>
    </ul>
  </nav>

  <main id="main-content">
    <h1>Welcome to ProxyNoxy's Site</h1>
    <p>This page scans the repository for HTML files and lists them in the sidebar.</p>
    <iframe id="page-frame" title="Selected page preview"></iframe>
  </main>

  <script>
    const owner = 'ProxyNoxy';
    const repo = 'proxynoxy.github.io';

    function formatLabel(path) {
      return path
        .replace(/\.html$/i, '')
        .replace(/[-_]/g, ' ')
        .replace(/\//g, ' / ')
        .trim()
        .replace(/\b\w/g, char => char.toUpperCase());
    }

    function setActiveLink(path) {
      document.querySelectorAll('#sidebar-links a').forEach(link => {
        link.classList.toggle('active', link.dataset.path === path);
      });
    }

    function openPage(path) {
      const pageFrame = document.getElementById('page-frame');
      const pageUrl = `https://${owner.toLowerCase()}.github.io/${path}`;

      pageFrame.src = pageUrl;
      pageFrame.style.display = 'block';
      setActiveLink(path);
    }

    async function loadSidebar() {
      const sidebarEl = document.getElementById('sidebar-links');

      try {
        const branches = ['main', 'master'];
        let tree = null;

        for (const branch of branches) {
          const url = `https://api.github.com/repos/${owner}/${repo}/git/trees/${branch}?recursive=1`;
          const response = await fetch(url, { headers: { 'Accept': 'application/vnd.github+json' } });

          if (response.ok) {
            const data = await response.json();
            tree = data.tree || [];
            break;
          }
        }

        if (!tree) {
          throw new Error('Could not load repository file tree.');
        }

        sidebarEl.innerHTML = '';

        const htmlFiles = tree
          .filter(file => file.path && file.path.toLowerCase().endsWith('.html'))
          .filter(file => file.path !== 'index.html');

        if (htmlFiles.length === 0) {
          sidebarEl.innerHTML = '<li class="status-msg">No project pages found yet.</li>';
          return;
        }

        htmlFiles
          .sort((a, b) => a.path.localeCompare(b.path))
          .forEach(file => {
            const item = document.createElement('li');
            const link = document.createElement('a');

            link.href = '#';
            link.dataset.path = file.path;
            link.textContent = formatLabel(file.path);
            link.addEventListener('click', event => {
              event.preventDefault();
              openPage(file.path);
            });

            item.appendChild(link);
            sidebarEl.appendChild(item);
          });

        openPage(htmlFiles[0].path);
      } catch (error) {
        console.error('Error fetching repository files:', error);
        sidebarEl.innerHTML = '<li class="status-msg">Error loading menu.</li>';
      }
    }

    document.addEventListener('DOMContentLoaded', loadSidebar);
  </script>
</body>
</html>
