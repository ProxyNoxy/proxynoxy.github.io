<!DOCTYPE html>
<html>
  <head>
    <title>Full-screen iframe</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      iframe {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <iframe src="https://lsbull.govt.hu/" title="Full-screen content"></iframe>
  </body>
</html>
